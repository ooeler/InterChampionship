# Erinnert rechtzeitig ans Erneuern des Supabase-Tokens (SUPABASE_ACCESS_TOKEN).
# Supabase-Tokens lassen sich nicht automatisch erneuern – darum legt dieser Ablauf
# 14 Tage vor Ablauf (Variable SUPABASE_TOKEN_EXPIRES, Format JJJJ-MM-TT) ein Issue an,
# ebenso sofort, wenn das Token ungültig ist. GitHub schickt dazu eine Mail.
name: Token-Erinnerung

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPIRES: ${{ vars.SUPABASE_TOKEN_EXPIRES }}
      TITLE: "Supabase-Token erneuern"
    steps:
      - name: Token prüfen
        id: chk
        run: |
          reason=""
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then reason="Das Secret SUPABASE_ACCESS_TOKEN fehlt."
          else
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects)
            [ "$code" = "200" ] || reason="Das Token wird von Supabase abgelehnt (HTTP $code) – vermutlich abgelaufen oder widerrufen."
          fi
          if [ -z "$reason" ] && [ -n "$EXPIRES" ]; then
            left=$(( ( $(date -d "$EXPIRES" +%s) - $(date +%s) ) / 86400 ))
            echo "Token gültig, läuft in $left Tagen ab ($EXPIRES)."
            [ "$left" -le 14 ] && reason="Das Token läuft in $left Tagen ab ($EXPIRES)."
          fi
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Issue anlegen (falls nötig und noch keines offen ist)
        if: steps.chk.outputs.reason != ''
        env:
          REASON: ${{ steps.chk.outputs.reason }}
        run: |
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$TITLE\" in:title" --json number --jq 'length')
          if [ "$open" != "0" ]; then echo "Issue bereits offen."; exit 0; fi
          next=$(date -d "+90 days" +%Y-%m-%d)
          gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label wartung --body "$(cat <<EOF
          **$REASON** Ohne gültiges Token kann nichts Neues ausgerollt werden (die App selbst läuft weiter).

          1. https://supabase.com/dashboard/account/tokens → **Generate new token** (Name \`github-actions\`, Ablauf 90 Tage) → kopieren
          2. https://github.com/$GITHUB_REPOSITORY/settings/secrets/actions → \`SUPABASE_ACCESS_TOKEN\` → **Update** → einfügen
          3. https://github.com/$GITHUB_REPOSITORY/settings/variables/actions → \`SUPABASE_TOKEN_EXPIRES\` → neues Ablaufdatum (z. B. \`$next\`)
          4. Das alte Token in Supabase widerrufen und dieses Issue schliessen.
          EOF
          )"
