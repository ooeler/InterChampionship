name: Tests

# Tests und Sicherheitsprüfung für main. Pull Requests werden über auto-merge.yml getestet, Releases über release.yml.
on:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  bilder:
    # Container-Images (Tag + Digest) stehen in .github/container-images.json statt hier: so kann der Workflow
    # Komponenten-Updates sie aktualisieren (mit dem GITHUB_TOKEN dürfen keine Workflow-Dateien geändert werden).
    # Nur Images der erwarteten Herkunft mit festem Digest werden angenommen.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.b.outputs.playwright }}
      semgrep: ${{ steps.b.outputs.semgrep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          sparse-checkout: .github/container-images.json
          sparse-checkout-cone-mode: false
      - id: b
        run: |
          p=$(jq -r .playwright .github/container-images.json)
          s=$(jq -r .semgrep .github/container-images.json)
          echo "$p" | grep -qxE 'mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}' || { echo "::error::Playwright-Image ungültig"; exit 1; }
          echo "$s" | grep -qxE 'semgrep/semgrep:[0-9]+\.[0-9]+\.[0-9]+@sha256:[0-9a-f]{64}' || { echo "::error::Semgrep-Image ungültig"; exit 1; }
          echo "playwright=$p" >> "$GITHUB_OUTPUT"
          echo "semgrep=$s" >> "$GITHUB_OUTPUT"

  shard:
    # Alle Tests auf allen Geräten, auf 6 gleichzeitig laufende Maschinen verteilt (jeder Test läuft genau einmal).
    # Der Job "test" unten sammelt die Teile ein; er ist die Pflicht-Prüfung für den Merge.
    # Aufteilung nach Projekt: WebKit (iphone) ist in der CI rund fünfmal langsamer als Chromium. Mit --shard über
    # alle Projekte landete das ganze iphone-Projekt in einem Teil (ca. 15 statt 3–5 Minuten).
    # Chromium-Geräte und Logiktests: 2 Teile, iphone: 4 Teile. Jedes Projekt muss genau einer Gruppe angehören
    # und jede Gruppe vollständig aufgeteilt sein (geprüft in tests/workflows.spec.js).
    name: test (Teil ${{ matrix.teil }}/6)
    needs: bilder
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { teil: 1, projekte: "--project=android --project=desktop --project=logik", shard: 1/2 }
          - { teil: 2, projekte: "--project=android --project=desktop --project=logik", shard: 2/2 }
          - { teil: 3, projekte: "--project=iphone", shard: 1/4 }
          - { teil: 4, projekte: "--project=iphone", shard: 2/4 }
          - { teil: 5, projekte: "--project=iphone", shard: 3/4 }
          - { teil: 6, projekte: "--project=iphone", shard: 4/4 }
    # Fertiges Playwright-Image: Browser und Systempakete sind schon drin, keine Installation mehr, die hängen bleiben kann.
    # Die Version muss zu @playwright/test in package.json passen (geprüft in tests/ci-container.spec.js).
    # Per Digest gepinnt (ein Tag kann neu belegt werden), Tag und Digest in .github/container-images.json (Job bilder);
    # aktuell gehalten vom Workflow Komponenten-Updates zusammen mit @playwright/test.
    container:
      image: ${{ needs.bilder.outputs.playwright }}
      options: --ipc=host
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - env:
          PROJEKTE: ${{ matrix.projekte }}
          SHARD: ${{ matrix.shard }}
        run: npx playwright test $PROJEKTE --shard="$SHARD"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-${{ matrix.teil }}
          path: playwright-report
          retention-days: 14

  test:
    # Sammelt die 6 Teile: nur grün, wenn jeder Teil grün ist (auch ein abgebrochener oder übersprungener Teil zählt als Fehler)
    needs: shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          ERGEBNIS: ${{ needs.shard.result }}
        run: |
          [ "$ERGEBNIS" = "success" ] || { echo "::error::Mindestens ein Testteil ist nicht grün ($ERGEBNIS)"; exit 1; }
          echo "Alle 6 Testteile grün"

  e2e:
    # End-to-End gegen eine echte, lokale Supabase (Docker): Migrationen, Row Level Security, Trigger, Edge Functions.
    # Kein Zugriff auf die Produktion – alles läuft im Runner und wird danach verworfen.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3
        with:
          version: 2.122.0  # gleiche Version wie im Release
      - run: npm ci
      - name: Playwright-Browser installieren (mit Zeitlimit und zweitem Versuch)
        # Die Supabase-Container brauchen Docker, darum bleibt dieser Job ausserhalb des Playwright-Images.
        run: timeout 300 npx playwright install --with-deps chromium || timeout 300 npx playwright install --with-deps chromium
      - name: Lokale Supabase starten
        run: |
          # Eigener Ordner ohne migrations/: die Migrationen werden unten wie im Release der Reihe nach angewendet
          mkdir -p /tmp/sb/supabase
          cp supabase/config.toml /tmp/sb/supabase/
          cp -r supabase/functions /tmp/sb/supabase/
          # wie in Produktion: nur feedback prüft das Login-Token selbst über Supabase, die anderen prüfen in der Function
          for fn in invite notify ops feedback-export passwort; do printf '\n[functions.%s]\nverify_jwt = false\n' "$fn" >> /tmp/sb/supabase/config.toml; done
          cd /tmp/sb
          supabase start -x studio,imgproxy,logflare,vector,supavisor,postgres-meta,storage-api
          supabase status -o env | sed 's/"//g' | sed -n \
            -e 's/^API_URL=/E2E_SUPABASE_URL=/p' -e 's/^ANON_KEY=/E2E_ANON_KEY=/p' \
            -e 's/^SERVICE_ROLE_KEY=/E2E_SERVICE_KEY=/p' -e 's/^DB_URL=/E2E_DB_URL=/p' >> "$GITHUB_ENV"
      - name: Datenbank wie in Produktion aufbauen (setup.sql + alle Migrationen)
        run: |
          psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/setup.sql
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "→ $(basename "$f")"
            psql "$E2E_DB_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: Sicherheitsprüfung Datenbank (wie im Release)
        run: |
          f=$(psql "$E2E_DB_URL" -tA -c "select coalesce(string_agg(p.proname, ', '), '') from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                where n.nspname = 'public' and p.prorettype <> 'trigger'::regtype and p.proname not in ('public_league', 'public_app_points') and has_function_privilege('anon', p.oid, 'EXECUTE')")
          t=$(psql "$E2E_DB_URL" -tA -c "select coalesce(string_agg(c.relname, ', '), '') from pg_class c join pg_namespace n on n.oid = c.relnamespace
                where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity")
          [ -z "$f" ] || { echo "::error::Ohne Login ausführbare Funktionen: $f"; exit 1; }
          [ -z "$t" ] || { echo "::error::Tabellen ohne Row Level Security: $t"; exit 1; }
          echo "Funktionsrechte und Row Level Security in Ordnung"
      - name: Edge Functions erreichbar?
        run: |
          code=$(curl -s -o /tmp/fn.json -w "%{http_code}" -X POST "$E2E_SUPABASE_URL/functions/v1/invite" \
            -H "apikey: $E2E_ANON_KEY" -H "Content-Type: application/json" -d '{"action":"check","token":"x"}')
          echo "invite → HTTP $code: $(head -c 200 /tmp/fn.json)"
          if [ "$code" = "404" ] || [ "$code" = "502" ] || [ "$code" = "503" ]; then
            echo "Functions separat starten"
            cd /tmp/sb && (nohup supabase functions serve > /tmp/functions.log 2>&1 &)
            for i in $(seq 1 30); do
              code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$E2E_SUPABASE_URL/functions/v1/invite" -H "apikey: $E2E_ANON_KEY" -H "Content-Type: application/json" -d '{"action":"check","token":"x"}')
              [ "$code" = "400" ] || [ "$code" = "200" ] || [ "$code" = "403" ] && break; sleep 2
            done
            echo "invite → HTTP $code"
          fi
      - run: npm run test:e2e
      - name: Logs bei Fehler
        if: failure()
        run: |
          cat /tmp/functions.log 2>/dev/null | tail -50 || true
          docker ps --format '{{.Names}}' | grep -i edge | xargs -r -I{} docker logs --tail 80 {} || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: playwright-report-e2e
          path: playwright-report-e2e
          retention-days: 14

  security:
    # Sicherheitsprüfung vor jedem Merge (zusätzlich: CodeQL und die statischen Tests in tests/sicherheit-statisch.spec.js)
    needs: bilder
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per Digest gepinnt (.github/container-images.json, Job bilder); aktuell gehalten vom Workflow Komponenten-Updates
    container:
      image: ${{ needs.bilder.outputs.semgrep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Semgrep (Schwachstellen-Muster, Secrets, Workflows)
        run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/secrets --config p/github-actions
          --exclude tests --exclude node_modules --exclude "app/vendor"
      - name: Abhängigkeiten mit bekannten Schwachstellen
        run: |
          apk add --no-cache nodejs npm > /dev/null 2>&1 || true
          npm audit --audit-level=high

  visuell:
    # Visueller Vergleich Basis ↔ Pull Request (tests/visuell.spec.js, playwright.visuell.config.js), nur in Pull Requests
    # (auto-merge.yml). Referenzbilder liegen nicht im Repo: dieser Job fotografiert zuerst den Basis-Stand
    # (--update-snapshots=all, in ein temporäres Verzeichnis) und vergleicht dann den PR-Stand damit. Spec, Mock und
    # Testwerkzeug (inkl. Browser) kommen in beiden Durchläufen aus dem PR, es wechselt nur app/ mit app/vendor/ –
    # so misst der Vergleich Änderungen der App, nicht des Browsers, und neue Tests scheitern nicht am alten Stand.
    # Informativ (Warnung + Diff-Bilder als Artefakt) für alle Branches; rot nur bei Abhängigkeits-Updates
    # (fix/abhaengigkeiten-…, dependabot/…): dann kein automatischer Merge (auto-merge.yml, Regel 7 in
    # scripts/komponenten-updates.mjs). Nicht Teil des Pflicht-Checks "test": eine gewollte Änderung lässt sich nach
    # Sichtung der Diff-Bilder von Hand mergen. Geprüft in tests/workflows.spec.js.
    if: github.event_name == 'pull_request'
    needs: bilder
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ${{ needs.bilder.outputs.playwright }}
      options: --ipc=host
    env:
      HOME: /root
      VISUELL_REFERENZ: /tmp/visuell-referenz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Basis-Stand holen (App und Abhängigkeiten)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: basis
          persist-credentials: false
          sparse-checkout: |
            app
            scripts/vendor.js
            package.json
            package-lock.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci
      - name: Referenzbilder vom Basis-Stand
        id: referenz
        continue-on-error: true # ohne Referenzbilder meldet der Schritt Ergebnis "Vergleich nicht möglich"
        run: |
          # app/vendor/ des Basis-Stands aus dessen eigenen Abhängigkeiten (ohne Install-Skripte)
          (cd basis && npm ci --ignore-scripts --no-audit --no-fund && node scripts/vendor.js)
          mv app app-pr && cp -r basis/app app
          set +e
          VISUELL_MODUS=referenz npx playwright test -c playwright.visuell.config.js --update-snapshots=all --reporter=list
          r=$?
          set -e
          rm -rf app && mv app-pr app && rm -rf visuell-ergebnis
          n=$(find "$VISUELL_REFERENZ" -name '*.png' 2>/dev/null | wc -l)
          echo "anzahl=$n" >> "$GITHUB_OUTPUT"
          [ "$r" = 0 ] || echo "::warning::Basis-Stand: nicht alle Ansichten fotografiert ($n Bilder) – fehlende werden nicht verglichen"
          echo "$n Referenzbilder"
      - name: PR-Stand vergleichen
        id: vergleich
        continue-on-error: true
        env:
          VISUELL_MODUS: vergleich
        run: npx playwright test -c playwright.visuell.config.js
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: steps.vergleich.outcome == 'failure'
        with:
          name: visuell-abweichungen
          path: |
            visuell-ergebnis
            visuell-bericht
          retention-days: 14
      - name: Ergebnis
        if: always()
        env:
          VERGLEICH: ${{ steps.vergleich.outcome }}
          ANZAHL: ${{ steps.referenz.outputs.anzahl }}
          BRANCH: ${{ github.head_ref }}
        run: |
          case "$BRANCH" in fix/abhaengigkeiten-*|dependabot/*) sperre=ja ;; *) sperre=nein ;; esac
          if [ "$VERGLEICH" = "success" ] && [ "${ANZAHL:-0}" -gt 0 ]; then
            echo "Keine visuellen Abweichungen ($ANZAHL Ansichten verglichen)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0
          fi
          if [ "$VERGLEICH" = "success" ]; then t="Visueller Vergleich nicht möglich: keine Referenzbilder vom Basis-Stand"
          else t="Visuelle Abweichungen gegenüber dem Basis-Stand (oder Vergleich fehlgeschlagen) – Diff-Bilder im Artefakt visuell-abweichungen"; fi
          echo "$t" >> "$GITHUB_STEP_SUMMARY"
          if [ "$sperre" = ja ]; then
            echo "::error::$t. Abhängigkeits-Update: kein automatischer Merge – nach Sichtung von Hand mergen."; exit 1
          fi
          echo "::warning::$t (nur zur Information)"
