# Deployment. Läuft automatisch nach jedem gemergten Pull Request (siehe auto-merge.yml)
# oder manuell über ein veröffentlichtes Release / "Run workflow".
# Tests laufen nur dann nicht nochmals, wenn der Release-Stand exakt (gleicher Git-Tree) der im Pull Request vollständig geprüfte Stand ist
# und das über die GitHub-API belegt ist (gemergter PR mit diesem Tree, grüne Pflicht-Jobs) – ein Input allein genügt nicht.
# Reihenfolge: Tests → Backup → Wartungsseite an → Datenbank-Migrationen → Edge Functions → App (GitHub Pages) → Wartungsseite aus.
# Bricht ein Schritt ab, geht nichts Neues live; das Backup erlaubt jederzeit ein Rollback.
# Härtung: Deploy-Jobs nur von main oder Tags v* und im Environment "production" (Branch-Policy main/v*); Secrets stehen
# nur in den Schritten, die sie brauchen, nicht im Job – fremde Actions (checkout, setup-cli) sehen sie nicht.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      grund:
        description: Grund für das Deployment
        required: false
        default: manuell
      getestet:
        description: "Git-Tree, der im Pull Request vollständig geprüft wurde (setzt auto-merge.yml; leer = Tests laufen)"
        required: false
        default: ""
      geprueft_sha:
        description: "Kopf-Commit des geprüften Pull Requests (setzt auto-merge.yml; leer = Tests laufen)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      tests: ${{ steps.t.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: t
        env:
          GH_TOKEN: ${{ github.token }}
          GETESTET: ${{ inputs.getestet }}
          KOPF: ${{ inputs.geprueft_sha }}
        run: |
          baum=$(git rev-parse 'HEAD^{tree}')
          # Im Zweifel immer testen: jede fehlende oder abweichende Angabe führt zum vollen Testlauf
          testen() { echo "tests=ja" >> "$GITHUB_OUTPUT"; echo "Stand $baum ist nicht als geprüft belegt ($1) – alle Tests laufen."; exit 0; }
          api() { gh api "repos/$GITHUB_REPOSITORY/$1" "${@:2}" 2>/dev/null; }
          echo "$GETESTET" | grep -qE '^[0-9a-f]{40}$' || testen "kein geprüfter Tree angegeben"
          [ "$GETESTET" = "$baum" ] || testen "im Pull Request wurde ein anderer Tree geprüft"
          echo "$KOPF" | grep -qE '^[0-9a-f]{40}$' || testen "kein geprüfter Commit angegeben"
          # 1. Der Release-Stand liegt auf main
          st=$(api "compare/main...$GITHUB_SHA" --jq .status) || testen "Vergleich mit main fehlgeschlagen"
          case "$st" in identical|behind) ;; *) testen "Stand liegt nicht auf main ($st)" ;; esac
          # 2. Ein in main gemergter Pull Request mit diesem Kopf-Commit hat genau diesen Tree hinterlassen
          mc=$(api "commits/$KOPF/pulls" --jq "[.[] | select(.merged_at != null and .base.ref == \"main\" and .head.sha == \"$KOPF\")][0].merge_commit_sha // empty") || mc=""
          [ -n "$mc" ] || testen "kein gemergter Pull Request mit Kopf $KOPF"
          [ "$(api "commits/$mc" --jq .commit.tree.sha || true)" = "$baum" ] || testen "der Merge von $KOPF hat einen anderen Tree"
          # 3. Im Lauf "Auto-Merge & Release" dieses Kopf-Commits waren alle Pflicht-Jobs grün
          #    (Jobs eines Workflow-Laufs, nicht frei anlegbare Check-Runs)
          laeufe=$(api "actions/runs?head_sha=$KOPF&event=pull_request&per_page=20" \
            --jq ".workflow_runs[] | select(.path == \".github/workflows/auto-merge.yml\" and .head_repository.full_name == \"$GITHUB_REPOSITORY\") | .id") || laeufe=""
          ok=""
          for run in $laeufe; do
            gruen=$(api "actions/runs/$run/jobs?per_page=100" --jq '[.jobs[] | select(.conclusion == "success") | .name]') || continue
            fehlt=""
            for j in "test / test" "test / e2e" "test / security" "codeql / analyze (javascript-typescript)"; do
              echo "$gruen" | jq -e --arg j "$j" 'any(.[]; . == $j)' > /dev/null || fehlt="$fehlt; $j"
            done
            if [ -z "$fehlt" ]; then ok=$run; break; fi
            echo "Lauf $run: nicht grün:${fehlt#;}"
          done
          [ -n "$ok" ] || testen "keine grünen Pflicht-Jobs für $KOPF"
          echo "tests=nein" >> "$GITHUB_OUTPUT"
          echo "Stand $baum ist belegt geprüft (Kopf $KOPF, Lauf $ok: test, e2e, security, CodeQL grün) – die Tests werden nicht wiederholt."

  test:
    needs: pruefen
    if: needs.pruefen.outputs.tests == 'ja'
    uses: ./.github/workflows/ci.yml

  backend:
    needs: [pruefen, test]
    # Weiter nur, wenn die Tests hier grün waren oder der identische Stand im Pull Request schon grün war
    # Deploy nur von main oder Release-Tags v*; das Environment erzwingt dasselbe zusätzlich auf GitHub-Seite
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.pruefen.result == 'success' && (needs.test.result == 'success' || (needs.test.result == 'skipped' && needs.pruefen.outputs.tests == 'nein'))
    runs-on: ubuntu-latest
    environment: production
    # Secrets nur in den Schritten, die sie brauchen (nicht für checkout/setup-cli sichtbar)
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Ref-Name prüfen
        # GITHUB_REF_NAME landet im SQL-Text des Backups: nur main oder eine Versionsnummer zulassen
        run: |
          echo "$GITHUB_REF_NAME" | grep -qE '^(main|v[0-9]+(\.[0-9]+){0,2}([-.][A-Za-z0-9]+)*)$' || { echo "::error::Unerwarteter Ref-Name für ein Deployment"; exit 1; }
      - name: Secrets vorhanden?
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
        run: |
          miss=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || miss="$miss SUPABASE_ACCESS_TOKEN"
          [ -n "$CRON_SECRET" ] || miss="$miss SUPABASE_CRON_SECRET"
          [ -n "$REF" ] || miss="$miss SUPABASE_PROJECT_REF(Variable)"
          if [ -n "$miss" ]; then echo "::error::Fehlt in GitHub → Settings → Secrets and variables → Actions:$miss"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects)
          if [ "$code" != "200" ]; then echo "::error::SUPABASE_ACCESS_TOKEN wird abgelehnt (HTTP $code) – vermutlich abgelaufen. Neues Token erstellen und in GitHub ersetzen (siehe README)."; exit 1; fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.122.0  # gleiche Version wie lokal getestet

      - name: Backup vor dem Deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # direkt per SQL – unabhängig von Funktionen, die sich durch dieses Release erst ändern
        run: |
          supabase db query --agent no --linked --project-ref "$REF"             "do \$\$ begin if to_regclass('public.league_state_history') is not null then
               insert into public.league_state_history (state_id, data, updated_by, reason)
               select id, data, updated_by, 'vor Release ${GITHUB_REF_NAME}' from public.league_state;
             end if; end \$\$" > /dev/null
          echo "Backup vor Release ${GITHUB_REF_NAME} erstellt"

      - name: Wartungsseite einschalten
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # offene Apps zeigen sofort "Update wird eingespielt" und speichern nichts, bis das Update live ist
        run: |
          supabase db query --agent no --linked --project-ref "$REF"             "do \$\$ begin if to_regclass('public.app_status') is not null then
               update public.app_status set maintenance = true, since = now() where id = 'main';
             end if; end \$\$" > /dev/null
          echo "Wartungsseite an"

      - name: Cron-Secret im Supabase Vault
        # für die Cron-Jobs (Match Day, Training) – so steht das Secret nirgends im Klartext.
        # `supabase db query` kennt keine Parameter: das Secret steht deshalb im SQL-Text. Damit es nicht bei jedem Release
        # (und ggf. im Statement-Log) auftaucht, wird es nur geschrieben, wenn sein SHA-256 vom Wert im Vault abweicht.
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
        run: |
          case "$CRON_SECRET" in *"'"*|*'$$'*) echo "::error::SUPABASE_CRON_SECRET enthält ' oder \$\$ – bitte ein Secret ohne diese Zeichen setzen"; exit 1 ;; esac
          soll=$(printf '%s' "$CRON_SECRET" | sha256sum | cut -c1-64)
          ist=$(supabase db query --agent no --linked --project-ref "$REF" -o json \
            "select coalesce((select encode(sha256(convert_to(decrypted_secret, 'UTF8')), 'hex') from vault.decrypted_secrets where name = 'cron_secret' limit 1), '') as c" 2>/dev/null \
            | jq -r 'if type == "array" then .[0].c else .rows[0].c end' 2>/dev/null || true)
          if [ "$ist" = "$soll" ]; then echo "Vault-Secret cron_secret unverändert"; exit 0; fi
          supabase db query --agent no --linked --project-ref "$REF" "do \$\$ declare i uuid; begin select id into i from vault.secrets where name = 'cron_secret'; if i is null then perform vault.create_secret('$CRON_SECRET', 'cron_secret'); else perform vault.update_secret(i, '$CRON_SECRET'); end if; end \$\$" > /dev/null
          echo "Vault-Secret cron_secret aktuell"

      - name: Datenbank-Migrationen
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() { supabase db query --agent no --linked --project-ref "$REF" "$@" 2>/dev/null; }
          q "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); alter table public.schema_migrations enable row level security;" > /dev/null
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            n=$(basename "$f")
            c=$(q -o json "select count(*)::int as c from public.schema_migrations where name = '$n'" | jq -r 'if type == "array" then .[0].c else .rows[0].c end')
            if [ "$c" = "1" ]; then echo "✓ $n (bereits angewendet)"; continue; fi
            echo "→ $n"
            supabase db query --linked --project-ref "$REF" -f "$f" > /dev/null
            q "insert into public.schema_migrations (name) values ('$n')" > /dev/null
          done

      - name: Funktionstest Datenbank (ohne bleibende Änderung)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # ruft snapshot_league in der echten DB auf und macht es sofort rückgängig;
          # jeder andere Fehler (z. B. ein Bug in einer Funktion) stoppt das Release
          supabase db query --agent no --linked --project-ref "$REF"             "do \$\$ begin begin perform public.snapshot_league('Funktionstest'); raise exception using errcode = 'P0099';
             exception when sqlstate 'P0099' then null; end; end \$\$" > /dev/null
          echo "snapshot_league funktioniert"

      - name: Sicherheitsprüfung Datenbank
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Ohne Login (anon) darf keine Funktion ausführbar sein (Ausnahmen für die öffentliche Rangliste: public_league und public_app_points), und jede Tabelle braucht Row Level Security
          q() { supabase db query --agent no --linked --project-ref "$REF" -o json "$1" | jq -r 'if type == "array" then .[0].c else .rows[0].c end'; }
          f=$(q "select coalesce(string_agg(p.proname, ', '), '') as c from pg_proc p join pg_namespace n on n.oid = p.pronamespace
                 where n.nspname = 'public' and p.prorettype <> 'trigger'::regtype and p.proname not in ('public_league', 'public_app_points') and has_function_privilege('anon', p.oid, 'EXECUTE')")
          t=$(q "select coalesce(string_agg(c.relname, ', '), '') as c from pg_class c join pg_namespace n on n.oid = c.relnamespace
                 where n.nspname = 'public' and c.relkind = 'r' and not c.relrowsecurity")
          [ -z "$f" ] || { echo "::error::Ohne Login ausführbare Funktionen: $f"; exit 1; }
          [ -z "$t" ] || { echo "::error::Tabellen ohne Row Level Security: $t"; exit 1; }
          echo "Funktionsrechte und Row Level Security in Ordnung"

      - name: Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          for d in supabase/functions/[!_]*/; do  # _shared = gemeinsamer Code, keine eigene Function
            fn=$(basename "$d")
            case "$fn" in feedback) flags="" ;; *) flags="--no-verify-jwt" ;; esac  # notify/ops prüfen selbst
            supabase functions deploy "$fn" $flags --use-api --project-ref "$REF"
          done

      - name: Mailvorlagen auf Deutsch (Passwort zurücksetzen usw.)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        # Die Standardvorlagen von Supabase sind englisch. Ein Fehler hier stoppt das Deployment nicht, wird aber gemeldet.
        run: |
          code=$(curl -s -o /tmp/antwort.json -w "%{http_code}" -m 30 -X PATCH "https://api.supabase.com/v1/projects/$REF/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" --data @supabase/mail-vorlagen.json)
          if [ "$code" = "200" ]; then echo "Mailvorlagen aktuell"; else echo "::warning::Mailvorlagen nicht aktualisiert (HTTP $code): $(jq -r '.message // .error // "keine Angabe"' /tmp/antwort.json 2>/dev/null | head -c 300)"; fi
          rm -f /tmp/antwort.json  # die Antwort enthält die Auth-Konfiguration

  pages:
    needs: backend
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: config.js aus den Repository-Variablen schreiben
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          node -e '
            const e = process.env;
            if (!e.SUPABASE_URL || !e.SUPABASE_ANON_KEY) { console.error("Variablen SUPABASE_URL / SUPABASE_ANON_KEY fehlen"); process.exit(1); }
            const c = { url: e.SUPABASE_URL, key: e.SUPABASE_ANON_KEY,
              providers: (e.OAUTH_PROVIDERS || "").split(",").map(s => s.trim()).filter(Boolean),
              vapidPublicKey: e.VAPID_PUBLIC_KEY || "" };
            require("fs").writeFileSync("app/config.js", "window.IM_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");'
      - name: Neue Cache-Version, damit Handys das Update laden
        run: sed -i "s/var V = \"ic-v1\"/var V = \"ic-${GITHUB_SHA::8}\"/" app/sw.js
      - name: App bauen (Content-Security-Policy)
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
        run: node scripts/build.mjs
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

  # Läuft immer (auch wenn ein Schritt fehlschlägt), damit die App nie in der Wartung hängen bleibt.
  # Die Apps laden danach automatisch neu und holen die neue Version.
  wartung-aus:
    needs: [backend, pages]
    if: always() && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && needs.backend.result != 'skipped'
    runs-on: ubuntu-latest
    environment: production
    env:
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: supabase/setup-cli@d239d1052f6f024a8d746d7e5aeddead63b9cb53 # v3
        with:
          version: 2.122.0
      - name: Wartungsseite ausschalten
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # GitHub Pages braucht nach dem Deployment einen Moment, bis die neue Version überall ausgeliefert wird
          [ "${{ needs.pages.result }}" = "success" ] && sleep 30
          # Bleibt die Wartungsseite an, ist die App für alle gesperrt: kurze Störungen bei Supabase nochmals versuchen
          for i in 1 2 3 4 5 6; do
            if supabase db query --agent no --linked --project-ref "$REF"             "do \$\$ begin if to_regclass('public.app_status') is not null then
               update public.app_status set maintenance = false, since = null where id = 'main';
             end if; end \$\$" > /dev/null; then
              echo "Wartungsseite aus"
              exit 0
            fi
            echo "Versuch $i fehlgeschlagen"
            sleep 30
          done
          echo "::error::Wartungsseite konnte nicht ausgeschaltet werden. Die App bleibt gesperrt, bis dieser Job erneut läuft."
          exit 1
