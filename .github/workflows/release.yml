# Deployment. Läuft automatisch nach jedem gemergten Pull Request (siehe auto-merge.yml)
# oder manuell über ein veröffentlichtes Release / "Run workflow".
# Reihenfolge: Tests → Backup → Datenbank-Migrationen → Edge Functions → App (GitHub Pages).
# Bricht ein Schritt ab, geht nichts Neues live; das Backup erlaubt jederzeit ein Rollback.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      grund:
        description: Grund für das Deployment
        required: false
        default: manuell

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  backend:
    needs: test
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
      REF: ${{ vars.SUPABASE_PROJECT_REF }}
      URL: ${{ vars.SUPABASE_URL }}
    steps:
      - name: Secrets vorhanden?
        run: |
          miss=""
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || miss="$miss SUPABASE_ACCESS_TOKEN"
          [ -n "$CRON_SECRET" ] || miss="$miss SUPABASE_CRON_SECRET"
          [ -n "$REF" ] || miss="$miss SUPABASE_PROJECT_REF(Variable)"
          if [ -n "$miss" ]; then echo "::error::Fehlt in GitHub → Settings → Secrets and variables → Actions:$miss"; exit 1; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" https://api.supabase.com/v1/projects)
          if [ "$code" != "200" ]; then echo "::error::SUPABASE_ACCESS_TOKEN wird abgelehnt (HTTP $code) – vermutlich abgelaufen. Neues Token erstellen und in GitHub ersetzen (siehe README)."; exit 1; fi
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Backup vor dem Deployment
        run: |
          res=$(curl -sS -m 60 -X POST "$URL/functions/v1/ops" -H "Authorization: Bearer $CRON_SECRET" \
                -H "Content-Type: application/json" -d "{\"action\":\"snapshot\",\"reason\":\"vor Release ${GITHUB_REF_NAME}\"}" -w "\n%{http_code}")
          code=$(echo "$res" | tail -1); echo "$res" | head -1
          # 404: Funktion "ops" existiert beim allerersten Ausrollen noch nicht → wird unten deployt, danach gesichert
          if [ "$code" = "404" ]; then echo "::warning::ops noch nicht deployt – Backup folgt nach dem Function-Deploy"; echo "LATE_BACKUP=1" >> "$GITHUB_ENV";
          elif [ "$code" != "200" ]; then echo "::error::Backup fehlgeschlagen (HTTP $code) – Deployment abgebrochen"; exit 1; fi

      - name: Datenbank-Migrationen
        run: |
          q() { supabase db query --linked --project-ref "$REF" "$@" 2>/dev/null; }
          q "create table if not exists public.schema_migrations (name text primary key, applied_at timestamptz not null default now()); alter table public.schema_migrations enable row level security;" > /dev/null
          for f in $(ls supabase/migrations/*.sql 2>/dev/null | sort); do
            n=$(basename "$f")
            c=$(q -o json "select count(*)::int as c from public.schema_migrations where name = '$n'" | jq -r '.rows[0].c')
            if [ "$c" = "1" ]; then echo "✓ $n (bereits angewendet)"; continue; fi
            echo "→ $n"
            supabase db query --linked --project-ref "$REF" -f "$f" > /dev/null
            q "insert into public.schema_migrations (name) values ('$n')" > /dev/null
          done

      - name: Edge Functions
        run: |
          for d in supabase/functions/*/; do
            fn=$(basename "$d")
            case "$fn" in feedback) flags="" ;; *) flags="--no-verify-jwt" ;; esac  # notify/ops prüfen selbst
            supabase functions deploy "$fn" $flags --use-api --project-ref "$REF"
          done

      - name: Backup nachholen (erstes Ausrollen von ops)
        if: env.LATE_BACKUP == '1'
        run: |
          code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" -X POST "$URL/functions/v1/ops" -H "Authorization: Bearer $CRON_SECRET" \
                 -H "Content-Type: application/json" -d "{\"action\":\"snapshot\",\"reason\":\"vor Release ${GITHUB_REF_NAME}\"}")
          [ "$code" = "200" ] || { echo "::error::Backup fehlgeschlagen (HTTP $code)"; exit 1; }

  pages:
    needs: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci --omit=dev
      - name: config.js aus den Repository-Variablen schreiben
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
          OAUTH_PROVIDERS: ${{ vars.OAUTH_PROVIDERS }}
          VAPID_PUBLIC_KEY: ${{ vars.VAPID_PUBLIC_KEY }}
        run: |
          node -e '
            const e = process.env;
            if (!e.SUPABASE_URL || !e.SUPABASE_ANON_KEY) { console.error("Variablen SUPABASE_URL / SUPABASE_ANON_KEY fehlen"); process.exit(1); }
            const c = { url: e.SUPABASE_URL, key: e.SUPABASE_ANON_KEY,
              providers: (e.OAUTH_PROVIDERS || "").split(",").map(s => s.trim()).filter(Boolean),
              vapidPublicKey: e.VAPID_PUBLIC_KEY || "" };
            require("fs").writeFileSync("app/config.js", "window.IM_CONFIG = " + JSON.stringify(c, null, 2) + ";\n");'
      - name: Neue Cache-Version, damit Handys das Update laden
        run: sed -i "s/var V = \"ic-v1\"/var V = \"ic-${GITHUB_SHA::8}\"/" app/sw.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app
      - id: deploy
        uses: actions/deploy-pages@v5
