# Legt Verbesserungsvorschläge aus der App als GitHub-Issues an (alle 10 Minuten).
# Nutzt den eingebauten GITHUB_TOKEN – es muss kein persönliches Token erstellt oder erneuert werden.
# Schlägt ein Lauf fehl, schickt GitHub dem Repository-Besitzer eine Mail.
name: Vorschläge → Issues

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: feedback-issues
  cancel-in-progress: false

jobs:
  issues:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/feedback-to-issues.mjs
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          CRON_SECRET: ${{ secrets.SUPABASE_CRON_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
