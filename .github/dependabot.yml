version: 2
updates:
  # npm: nur Sicherheitsupdates (Limit 0 schaltet normale Versions-Updates ab).
  # Jeder Sicherheits-PR wird nach grünen Tests gemergt und automatisch deployt (siehe auto-merge.yml).
  # Versions-Updates für package.json, die npm:-Imports der Edge Functions und die CI-Images macht der Workflow
  # komponenten-updates.yml (täglich Sicherheit, montags neue Versionen ≥ 7 Tage, siehe SECURITY.md).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 0
    commit-message:
      prefix: security

  # GitHub Actions: wöchentlich, gruppiert. Automatisch gemergt nur, wenn alle Regeln in scripts/actions-update-pruefen.mjs
  # erfüllt sind (siehe auto-merge.yml und SECURITY.md), sonst prüfen und von Hand mergen.
  # cooldown: neue Versionen erst nach 7 Tagen vorschlagen (Zeit, um kompromittierte Releases zu entdecken)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
