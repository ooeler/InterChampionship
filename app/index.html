var INFO_MD="## Herren Inter\n**Die interne Flying Penguins Meisterschaft.**\n\nInter-Herren bietet ehemaligen Swissunihockey-Spielern eine Plattform, dem Verein treu zu bleiben und die Freude am Unihockey auszuleben. Die monatlichen Meisterschaftsspiele sind der Anreiz für ein stetiges wöchentliches Training.\n\n## Ziele\n- **Interne Meisterschaft** – eine Challenge für den wöchentlichen Trainingsbetrieb, ohne den Aufwand der Swissunihockey-Meisterschaft.\n- **Motivation & konstantes, hochwertiges Training** – zusammen Sport machen, Freude am Unihockey, Kollegschaften pflegen.\n- **Team- und Vereinszusammenhalt** – aktive Teilnahme am Vereinsleben, nach der aktiven Karriere bis zur „Pension“.\n\n## Match-Tag\n**Jeder erste Mittwoch im Monat ist Match-Tag.**\n\nNächster Match-Tag: {naechster-matchtag}\n\n- Die restlichen Trainings bleiben bestehen und bieten Platz für andere Trainingsformen.\n- Zwei interne, konstante Teams.\n- Match-Shirt am Matchtag, Ziel Doppelhalle, Social Media.\n- Vollzähliges, gemeinsames „eis go trinke“ nach dem Match.\n- Match, Sieg, Meister, Pokal – Gewinner und Verlierer feiern gemeinsam.\n\n## Wintermeisterschaft\n- September bis Dezember\n- Meister aufgrund gewonnener Matchtage\n- Dezember-Match zählt doppelt\n- Verlierer organisieren den Winter Event am zweiten Dezember-Mittwoch ({winter-event})\n\n## Sommermeisterschaft\n- Januar bis April\n- Meister aufgrund gewonnener Matchtage\n- April-Match zählt doppelt\n- Verlierer organisieren den Sommer Event am ersten Mai-Freitag ({sommer-event})\n- Sommermeister = Jahres-Intermeister\n- Team, Sieger der Saison-Anwesenheit und Saison-Topskorer werden auf den Pokal graviert\n\n## Hauptmatch\n- 1 Bonustor für das Team mit der besseren Trainingspräsenz\n- Je 1 Bonustor pro Sieg im Pre-Game (max. 3)\n- Der Sieger des Hauptmatchs gewinnt den Matchtag\n- Kann ein Team nicht antreten, verliert es Forfait 0 : 5\n\n## Sonstiges Training\nAnalog den aktuellen Trainings, mit Platz für neue Ideen und Trainingsformen.\n\n- **Einlaufen** – organisiert durch den Trainer\n- **Torhüter einschiessen / Passübungen** – kurzer Pass, langer Pass, Pass-Stern o. ä.\n- **3 Übungen** durch Teammitglieder (Ende zwischen 19:15 und 19:30)\n- **Mätschlä**\n\n## Organisatorisches\n- Saisonanmeldung über Google Drive (wie Meisterschaft)\n- Jahresbeitrag CHF 100.– (reduziert von CHF 200.–)\n- CHF 300.– Teambeitrag vom Verein für den Coach, analog den anderen Teams\n- Helfereinsätze usw.: Pflicht analog den anderen Vereinsmitgliedern\n- Empfehlung: CHF 50.– pro Mitglied in die Teamkasse für die beiden Teamevents\n\n## Captains & Spielleitung\n**Captains** sind verantwortlich für\n\n- Transfers\n- genügend Spieler am Matchtag\n- das Nachtragen der Anwesenheit\n- die Organisation des Teamevents\n\nEine Verschiebung der Meisterschaftsrunde beantragen die Captains mindestens 2 Wochen im Voraus bei der Spielleitung.\n\n**Spielleitung** ist verantwortlich für\n\n- das Konzept\n- die Bereitstellung der Vorlagen\n- das Bearbeiten der Anträge der Captains\n\nDie Spielleitung greift erst ein, wenn sie eine Gefährdung des Projekts oder eine Benachteiligung eines Teams erahnt.\n\nSpielleitung: Michael Süess, Othmar Oeler",IE=null,INFOD={t:"",b:""};
